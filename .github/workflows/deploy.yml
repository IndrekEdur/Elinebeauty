name: Kontroll ja Zone FTPS deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: python3 -c "import sys; assert sys.version_info >= (3, 12)"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Avaldamise olek
        if: vars.ZONE_DEPLOY_ENABLED != 'true'
        run: echo '::notice::Avaldamine on lukus. Build valmis, Zone serveriga ühendust ei loodud. Seadista production ja lisa ZONE_DEPLOY_ENABLED=true ainult pärast omaniku kinnitust (README).'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ZONE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: zone-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://elinebeauty.ee
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: website
          path: dist
      - name: Varunda olemasolev index.html (serverit muutmata)
        env:
          ZONE_DEPLOY_ENABLED: ${{ vars.ZONE_DEPLOY_ENABLED }}
          ZONE_FTP_HOST: ${{ secrets.ZONE_FTP_HOST }}
          ZONE_FTP_PORT: ${{ secrets.ZONE_FTP_PORT }}
          ZONE_FTP_USERNAME: ${{ secrets.ZONE_FTP_USERNAME }}
          ZONE_FTP_PASSWORD: ${{ secrets.ZONE_FTP_PASSWORD }}
          ZONE_FTP_TARGET_PATH: ${{ secrets.ZONE_FTP_TARGET_PATH }}
          ZONE_CONFIRMED_FTP_TARGET_PATH: ${{ vars.ZONE_CONFIRMED_FTP_TARGET_PATH }}
        run: python3 scripts/ftps.py backup
      - name: Säilita varukoopia enne esimest serverimuudatust
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: index-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .deployment-backup/index.html
            .deployment-backup/sha256.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Kontrolli varukoopiat ja laadi failid FTPS kaudu
        env:
          ZONE_DEPLOY_ENABLED: ${{ vars.ZONE_DEPLOY_ENABLED }}
          ZONE_FTP_HOST: ${{ secrets.ZONE_FTP_HOST }}
          ZONE_FTP_PORT: ${{ secrets.ZONE_FTP_PORT }}
          ZONE_FTP_USERNAME: ${{ secrets.ZONE_FTP_USERNAME }}
          ZONE_FTP_PASSWORD: ${{ secrets.ZONE_FTP_PASSWORD }}
          ZONE_FTP_TARGET_PATH: ${{ secrets.ZONE_FTP_TARGET_PATH }}
          ZONE_CONFIRMED_FTP_TARGET_PATH: ${{ vars.ZONE_CONFIRMED_FTP_TARGET_PATH }}
        run: python3 scripts/ftps.py deploy
